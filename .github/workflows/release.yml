name: Release Career Radar desktop launchers

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - '.github/release-request.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Assemble Windows launcher bundle
        run: python distribution/package.py --platform win
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows
          path: dist/CareerRadar-win-x64.zip
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - name: Assemble macOS launcher bundle
        run: python distribution/package.py --platform mac
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos
          path: dist/CareerRadar-mac-universal.zip
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify both platforms and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/pkg-windows/CareerRadar-win-x64.zip dist/
          cp artifacts/pkg-macos/CareerRadar-mac-universal.zip dist/
          (cd dist && sha256sum CareerRadar-*.zip > SHA256SUMS.txt)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(tr -d '[:space:]' < .github/release-request.txt)"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/CareerRadar-*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" dist/CareerRadar-*.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" \
              --title "Career Radar $tag" \
              --notes "Windows and macOS launcher bundles for the local Cloudflare Workers/D1 web app. These are NOT native desktop binaries. Install Node.js 22.13+; unzip to a permanent folder, double-click the matching launcher, and open the local URL shown in the terminal. First run installs dependencies and initializes a local D1 database."
          fi
